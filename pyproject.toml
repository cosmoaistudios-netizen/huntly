[project]
name = "huntly"
version = "0.2.0"
description = "Autonomous AI-powered job hunting terminal assistant for remote software engineers"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
authors = [
    {name = "Cosmo AI Studios", email = "cosmoaistudios@gmail.com"}
]
keywords = [
    "job-hunt",
    "terminal",
    "tui",
    "textual",
    "ai-agent",
    "nemotron",
    "nvidia",
    "recruitment",
    "freelance",
    "remote-jobs",
    "rapidapi"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: User Interfaces",
]

dependencies = [
    "textual>=0.80.0",
    "rich>=13.0",
    "click>=8.0",
    "openai>=1.0",
    "httpx>=0.27",
    "pypdf>=4.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
huntly = "huntly.cli:cli"

[project.urls]
Homepage = "https://github.com/cosmoaistudios-netizen/huntly"
Repository = "https://github.com/cosmoaistudios-netizen/huntly.git"
Issues = "https://github.com/cosmoaistudios-netizen/huntly/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["huntly*"]

[tool.setuptools.package-data]
huntly = ["config/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
